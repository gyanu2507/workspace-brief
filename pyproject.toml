[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-brief"
version = "0.1.0"
description = "Ask a live GitHub workspace what changed — with a planner, citations, and a trace."
requires-python = ">=3.11"
authors = [{ name = "Gyanu Mayank" }]
dependencies = [
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
brief = "workspace_brief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
