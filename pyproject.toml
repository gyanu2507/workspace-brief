[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-brief"
version = "0.5.0"
description = "Ask a live GitHub workspace what changed — with a planner, citations, and a trace."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Gyanu Mayank" }]
keywords = ["rag", "github", "agent", "citations"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/gyanu2507/workspace-brief"
Issues = "https://github.com/gyanu2507/workspace-brief/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.115", "ruff>=0.6"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1"]

[project.scripts]
brief = "workspace_brief.cli:main"
brief-api = "workspace_brief.api:serve"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workspace_brief = ["data/northstar/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:randomly"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
